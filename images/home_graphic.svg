<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5eef8"/>
      <stop offset="100%" stop-color="#ebdcf2"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#741f8a"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="90" r="40" fill="#741f8a" opacity="0.08"/>
  <circle cx="520" cy="360" r="60" fill="#741f8a" opacity="0.08"/>
  
  <!-- Desk Base -->
  <rect x="80" y="340" width="440" height="16" rx="8" fill="#d1b3db"/>
  
  <!-- Books Stack -->
  <rect x="120" y="290" width="110" height="22" rx="4" fill="#741f8a"/>
  <rect x="110" y="312" width="130" height="28" rx="4" fill="#814793"/>
  <rect x="125" y="270" width="100" height="20" rx="4" fill="#9333ea"/>
  <rect x="130" y="296" width="20" height="8" rx="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- Brain / Cognition Symbol (Behavioral Research) -->
  <g transform="translate(300, 180)">
    <!-- Central Glow -->
    <circle cx="0" cy="0" r="85" fill="#ffffff" filter="drop-shadow(0 8px 24px rgba(116,31,138,0.15))"/>
    
    <!-- Stylized Brain Nodes & Network -->
    <path d="M-45,-10 C-45,-40 -20,-60 0,-60 C20,-60 45,-40 45,-10 C45,15 25,35 15,50 C10,58 5,60 0,60 C-5,60 -10,58 -15,50 C-25,35 -45,15 -45,-10 Z" fill="none" stroke="url(#purpleGrad)" stroke-width="5" stroke-linecap="round"/>
    
    <path d="M-25,-20 C-15,-30 0,-30 10,-20 C20,-10 15,10 0,20 C-15,10 -20,-10 -25,-20" fill="none" stroke="#741f8a" stroke-width="3" stroke-dasharray="4,4"/>
    
    <!-- Synapse dots -->
    <circle cx="-35" cy="-25" r="5" fill="#741f8a"/>
    <circle cx="35" cy="-25" r="5" fill="#741f8a"/>
    <circle cx="0" cy="-50" r="6" fill="#9333ea"/>
    <circle cx="-20" cy="15" r="5" fill="#741f8a"/>
    <circle cx="20" cy="15" r="5" fill="#741f8a"/>
    <circle cx="0" cy="40" r="5" fill="#9333ea"/>
  </g>
  
  <!-- Growth chart line behind brain -->
  <path d="M 200 240 Q 250 180 320 200 T 460 110" fill="none" stroke="#00b4d8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="460" cy="110" r="7" fill="#00b4d8"/>
  
  <!-- Lightbulb (Inspiration / Insights) -->
  <g transform="translate(430, 250)">
    <rect x="0" y="30" width="30" height="40" rx="6" fill="#741f8a"/>
    <circle cx="15" cy="20" r="24" fill="#ffd166"/>
    <circle cx="15" cy="20" r="16" fill="#ffe082"/>
    <path d="M6,25 L24,25" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <text x="300" y="405" font-family="'Merriweather', serif" font-size="20" font-weight="700" fill="#741f8a" text-anchor="middle">Behavioural Research Foundation</text>
  <text x="300" y="428" font-family="'Lato', sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="middle">Registered Society Under Societies Registration Act, 1860</text>
</svg>